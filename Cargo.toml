[package]
name = "rl"
version = "0.1.0"
edition = "2021"
description = "Hand-rolled, deterministic Rocket League style physics simulation"
license = "MIT"

# Deliberately zero dependencies: the simulation core must be reproducible
# from the standard library alone, with nothing that could vary per platform.
[dependencies]

[lib]
name = "rl"
path = "src/lib.rs"

[[bin]]
name = "play"
path = "src/bin/play.rs"

[workspace]
# `rl` stays dependency-free so the simulation core stays portable and
# reproducible; the Bevy viewer is a separate crate that only reads it.
members = ["view"]

[profile.release]
opt-level = 3

# Bevy is unusably slow unoptimised, but optimising all of it makes every
# incremental build painful. This is the standard middle ground.
[profile.dev]
opt-level = 1
# Full debug info is the bulk of both the build time and the ~4 GB link peak
# (and of the multi-GB target dir). Line tables keep file/line in backtraces
# while cutting most of that. Use `false` for the lightest builds, or remove
# this for full debug info if you need to inspect variables interactively.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
