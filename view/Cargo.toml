[package]
name = "rl_view"
version = "0.1.0"
edition = "2021"
description = "Bevy 3D viewer running RocketSim for physics"

[dependencies]

# Camera settings are loaded from `camera.toml` (see `CameraSettings` in main.rs).
# TOML rather than YAML: it is the Rust-native config format, supports comments,
# and does not need the deprecated `serde_yaml` crate.
serde = { version = "1", features = ["derive"] }
toml = "1"

# The physics. Pure-Rust RocketSim v3 ("a Rust library for simulating Rocket
# League games"), pinned to the `v3-rust` branch head rather than the branch
# name so it can't move under us. It is not on crates.io yet.
#
# At runtime it loads RL's arena collision meshes from `./collision_meshes/`
# (see `view/src/sim.rs`); those are NOT in the repo.
rocketsim = { git = "https://github.com/ZealanL/RocketSim", rev = "6cf55d33d070ff611a09564885dac230f66fd2f6" }

# The bot-facing half of RLBot v5. The viewer does not run RLBotServer or
# Rocket League: this crate speaks the same TCP/FlatBuffers protocol that RLBot
# bots use, so standard v5 bots can connect directly to the simulation.
rlbot_bridge = { path = "../rlbot_bridge" }

# Physically-informed engine synthesis (MIT). The viewer uses its `Generator`
# as a streaming rodio source, so the engine follows RPM continuously instead
# of crossfading pre-rendered loops. `default-features = false` drops the GUI.
# Pinned to the commit the embedded `assets/audio/engine.esc` was taken from.
enginesound = { git = "https://github.com/DasEtwas/enginesound", rev = "e5fcca587397c0c8ba9c9d24874b951fed74d260", default-features = false }
# Deserialises the embedded enginesound preset. The preset was written for
# ron 0.6, so stay on that major version.
ron = "0.6"

# Feature set is spelled out rather than using bevy's convenient `3d`/`ui`
# meta-features, because those pull in `default_platform`, which includes a
# lot more than this viewer needs. `bevy_gilrs` is listed explicitly because it
# needs libudev-dev, and `bevy_audio` because it needs ALSA; those are the two
# system packages this build requires:
#
#     sudo apt-get install libudev-dev libasound2-dev
#
# `wav` lets `AudioSource` decode the small PCM clips that `audio.rs`
# synthesises at startup, so the viewer ships no sound files.
#
# Everything else in `default_platform` is either unneeded or pulled in anyway.
[dependencies.bevy]
version = "0.19"
default-features = false
features = [
    "3d_bevy_render",  # pbr, meshes, materials, lights, core pipeline
    "ui_bevy_render",  # renders the HUD text
    "ui_api",          # Text / Node / TextUiWriter
    "default_app",     # asset server, log, state, async executor
    "bevy_winit",      # window + event loop
    "bevy_gilrs",      # gamepad input (needs libudev-dev on Linux)
    "x11",
    "wayland",
    "default_font",    # so Text works without shipping a font file
    "multi_threaded",
    "std",
    "png",             # --screenshot
    "bevy_audio",       # procedural engine/boost/impact sounds (needs ALSA)
    "wav",             # decode the generated PCM clips
]

[dev-dependencies]
# Only used by `examples/gamepad_probe.rs`, which reports how gilrs maps a pad.
# The same version is already pulled in by `bevy_gilrs`, so this adds no build.
gilrs = "0.11"
